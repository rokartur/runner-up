name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - goos: darwin
            goarch: amd64
            os: macos-latest
            target: x86_64-apple-darwin
          # musl: a glibc build fails on older or musl-based Linux.
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - goos: linux
            goarch: amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - goos: windows
            goarch: arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - goos: windows
            goarch: amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the Rust target
        run: |
          rustup update stable --no-self-update
          rustup target add "${{ matrix.target }}"
          if [ "${{ matrix.goos }}" = "linux" ]; then sudo apt-get update && sudo apt-get install -y musl-tools; fi

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_UP_VERSION: v${{ needs.release-please.outputs.version }}
          # Windows binaries carry their C runtime, as Go's do.
          RUSTFLAGS: ${{ matrix.goos == 'windows' && '-C target-feature=+crt-static' || '' }}
        run: |
          cargo build --locked --release --target "$TARGET"
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          cp "target/$TARGET/release/runner-up${ext}" "runner-up${ext}"

      - name: Archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          name="runner-up-v${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            7z a -tzip "${name}.zip" runner-up.exe
          else
            tar czf "${name}.tar.gz" runner-up
          fi

      - name: Upload archive
        env:
          GH_TOKEN: ${{ github.token }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          name="runner-up-v${VERSION}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            gh release upload "${TAG_NAME}" "${name}.zip"
          else
            gh release upload "${TAG_NAME}" "${name}.tar.gz"
          fi

      - name: Upload archive as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.release-please.outputs.version }}
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: runner-up-v${{ needs.release-please.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.*

  # release-please opens its release PR with GITHUB_TOKEN, and GitHub creates no
  # workflow runs for such PRs (verified: release PR head commits carry zero
  # check runs). The "PR must be raised via no-mistakes" required check can
  # therefore never report on a release PR by itself, which would leave every
  # release blocked on a status that can never arrive.
  #
  # The required check is decided by the shared require-no-mistakes action,
  # which can never report on a GITHUB_TOKEN PR that produces no workflow run at
  # all. Publish the statuses here instead, only for a PR the repository's local
  # .github/scripts/no-mistakes-gate.sh accepts as structurally release-please's
  # own: reserved branch prefix, same-repository head and Release Please footer.
  # The script reads no author and no attestation.
  release-pr-gate-status:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Publish the required statuses on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          pr_numbers=$(gh api "repos/${REPO}/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.ref | startswith("release-please--") or startswith("release-please/")) | .number')

          if [ -z "$pr_numbers" ]; then
            echo "No open release-please PR; nothing to stamp."
            exit 0
          fi

          for pr in $pr_numbers; do
            eval "$(gh api "repos/${REPO}/pulls/${pr}" --jq '
              "PR_NUMBER=" + (.number|tostring|@sh) +
              " PR_HEAD_REF=" + (.head.ref|@sh) +
              " PR_HEAD_REPO=" + (.head.repo.full_name|@sh) +
              " PR_BASE_REPO=" + (.base.repo.full_name|@sh) +
              " PR_HEAD_SHA=" + (.head.sha|@sh) +
              " PR_BODY=" + ((.body // "")|@sh)')"
            export PR_NUMBER PR_HEAD_REF PR_HEAD_REPO PR_BASE_REPO PR_BODY

            if ./.github/scripts/no-mistakes-gate.sh; then
              # Both required contexts: GitHub runs no workflow on this
              # GITHUB_TOKEN PR, and main's own CI already tested its code.
              for context in 'PR must be raised via no-mistakes' 'CI passed'; do
                echo "Stamping ${context} on PR #${PR_NUMBER} (${PR_HEAD_SHA})."
                gh api --method POST "repos/${REPO}/statuses/${PR_HEAD_SHA}" \
                  -f state=success \
                  -f context="${context}" \
                  -f description='release-please release PR: structurally exempt' \
                  -f target_url="${RUN_URL}" >/dev/null
              done
            else
              echo "PR #${PR_NUMBER} is not a structural release-please PR; leaving it to the required check."
            fi
          done

  notify-issues:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment on resolved issues
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # Get the previous tag
          prev_tag=$(gh api repos/${{ github.repository }}/releases \
            --jq "[.[] | select(.tag_name != \"${TAG_NAME}\")] | first | .tag_name")

          if [ -z "$prev_tag" ] || [ "$prev_tag" = "null" ]; then
            echo "No previous release found, skipping"
            exit 0
          fi

          echo "Finding PRs between ${prev_tag} and ${TAG_NAME}"

          # Get commits between tags via compare API (excludes base tag, no inclusive-boundary issue)
          # Note: limited to 250 commits, but we only need PR numbers which are deduped anyway
          commits=$(gh api repos/${{ github.repository }}/compare/${prev_tag}...${TAG_NAME} \
            --jq '.commits[].sha')

          # Collect unique PR numbers across all commits (avoids duplicate timeline queries)
          declare -A seen_prs
          for sha in $commits; do
            prs=$(gh api repos/${{ github.repository }}/commits/${sha}/pulls \
              --jq '.[].number' 2>/dev/null || true)
            for pr in $prs; do
              seen_prs[$pr]=1
            done
          done

          # For each unique PR, find linked issues via PR body and comment
          declare -A seen_issues
          for pr in "${!seen_prs[@]}"; do
            # Check the PR body for "Fixes #N" / "Closes #N" patterns (same-repo only, excludes org/repo#N)
            issues=$(gh api repos/${{ github.repository }}/pulls/${pr} \
              --jq '.body' 2>/dev/null \
              | grep -oiE '(fix(es|ed)?|close[sd]?|resolve[sd]?)\s+#[0-9]+' \
              | grep -oE '[0-9]+' || true)

            for issue in $issues; do
              if [ -z "${seen_issues[$issue]+x}" ]; then
                seen_issues[$issue]=1
                echo "Commenting on issue #${issue}"
                gh issue comment "$issue" \
                  --repo ${{ github.repository }} \
                  --body "This issue has been addressed in [v${VERSION}](https://github.com/${{ github.repository }}/releases/tag/${TAG_NAME}). :tada:"
              fi
            done
          done

  checksums:
    needs: [release-please, build-and-upload]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    # The release signing key's private half is a secret of this environment.
    # runner-up's Windows service installs only a release whose checksums.txt
    # it signed (src/release.rs), so only main should reach it.
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: archive-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum runner-up-v* > checksums.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" checksums.txt
        working-directory: ${{ github.workspace }}

      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # A raw Ed25519 signature of the file, as src/release.rs checks it.
          openssl pkeyutl -sign -rawin -inkey <(printf '%s\n' "$RELEASE_SIGNING_KEY") -in checksums.txt -out checksums.txt.sig
          # It must verify with a key runner-up trusts (src/release.rs),
          # or runner-up's Windows service would refuse the release.
          for key in $(sed -n 's/^const RELEASE_SIGNING_KEYS: &str = "\(.*\)";$/\1/p' src/release.rs); do
            { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; printf '%s' "$key" | base64 -d; } > trusted.der
            if openssl pkeyutl -verify -pubin -keyform DER -inkey trusted.der -rawin -in checksums.txt -sigfile checksums.txt.sig; then
              exit 0
            fi
          done
          echo "::error::The release signing key is not one src/release.rs trusts."
          exit 1

      - name: Upload signature
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "${TAG_NAME}" checksums.txt.sig
